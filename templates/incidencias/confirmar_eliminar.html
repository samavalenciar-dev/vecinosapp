{% extends 'base.html' %}
{% block titulo %}Eliminar{% endblock %}
{% block contenido %}
<div class='card mx-auto' style='max-width: 500px;'>
    <div class='card-header'>¿Estás seguro?</div>
    <div class='card-body'>
        <p>Vas a borrar la incidencia <strong>{{ object.titulo }}</strong>. Esta acción no se puede deshacer.</p>
        <form method='post'>
            {% csrf_token %}
            <button class='btn btn-danger'>Sí, borrar</button>
            <a class='btn btn-primary' href='{% url 'detalle_incidencia' object.pk %}'>No, volver</a>
        </form>
    </div>
</div>
{% endblock %}
