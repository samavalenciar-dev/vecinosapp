<!doctype html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>{% block titulo %}VecinosApp{% endblock %}</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
</head>
<body class='bg-light'>
<nav class='navbar navbar-expand-lg navbar-dark bg-primary mb-4'>
    <div class='container'>
        <a class='navbar-brand' href='{% url 'lista_incidencias' %}'>VecinosApp</a>
        <div class='navbar-nav ms-auto align-items-center'>
            {% if user.is_authenticated %}
                <a class='nav-link' href='{% url 'lista_incidencias' %}'>Incidencias</a>
                <a class='nav-link' href='{% url 'perfil' %}'>Mi perfil ({{ user.username }})</a>
                {% if es_admin %}<a class='nav-link' href='/admin/'>Panel admin</a>{% endif %}
                <form method='post' action='{% url 'logout' %}' class='d-inline'>
                    {% csrf_token %}
                    <button class='btn btn-outline-light btn-sm ms-2'>Salir</button>
                </form>
            {% else %}
                <a class='nav-link' href='{% url 'login' %}'>Ingresar</a>
                <a class='nav-link' href='{% url 'registro' %}'>Registrarse</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class='container'>
    {% for mensaje in messages %}
        <div class='alert alert-{% if mensaje.tags == 'error' %}danger{% else %}{{ mensaje.tags }}{% endif %}'>{{ mensaje }}</div>
    {% endfor %}
    {% block contenido %}{% endblock %}
</main>

<script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script>
</body>
</html>
